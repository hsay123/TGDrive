name: Build & Test

# CI verification for the packaging branch. The app lives in the `televault/`
# subdirectory of this repository, so every run uses that as its working dir.
# NOTE: this file must live at the REPO ROOT (.github/workflows/) — GitHub does
# not discover workflows nested inside a subdirectory.

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x64, RPM 4.x
            smoke: xvfb-run -a npm run test:smoke
          - os: windows-2022 # x64 — has the VS C++ build tools node-gyp needs
            smoke: npm run test:smoke
          - os: macos-latest # arm64 (Apple Silicon)
            smoke: npm run test:smoke
          - os: macos-15-intel # x64 (Intel) — macos-13/macos-14 are retired
            smoke: npm run test:smoke
    defaults:
      run:
        working-directory: televault
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: televault/package-lock.json

      - name: Install Linux app runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-0 libnotify4 libnss3 xvfb

      # node-gyp (via electron-rebuild's postinstall) imports distutils, which
      # was removed in Python 3.12+. Pin 3.11 off Linux so npm ci can rebuild
      # native modules on macOS and Windows.
      - name: Set up Python 3.11 for node-gyp (non-Linux)
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck main + core
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build unpacked app
        run: npm run build:dir

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64

      - name: Packaged-app smoke test (unpacked)
        if: runner.os != 'Windows'
        run: ${{ matrix.smoke }}

      # Users run the installed app, not win-unpacked. Install NSIS silently
      # into a path WITH A SPACE to exercise Windows path handling too.
      - name: Install and smoke-test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'release/TeleVault-windows-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'TeleVault Smoke Install'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          # NSIS needs /S first and /D=<dir> last, UNQUOTED even when the path
          # has spaces. A PowerShell -ArgumentList array would quote the path,
          # so pass one literal argument line instead.
          $proc = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "NSIS installer exited $($proc.ExitCode)" }
          # electron-builder may place the exe at the install root or one level
          # down; locate it rather than assuming an exact layout.
          $installedExe = Get-ChildItem -Path $installDir -Filter 'TeleVault.exe' -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installedExe) {
            Write-Host "Install tree under ${installDir}:"
            if (Test-Path $installDir) { Get-ChildItem -Path $installDir -Recurse | ForEach-Object { Write-Host $_.FullName } }
            throw "Installed app not found under $installDir"
          }
          Write-Host "Smoke-testing installed exe: $installedExe"
          $env:TELEVAULT_SMOKE_EXE = $installedExe
          npm run test:smoke

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.os }}
          path: televault/release/
          retention-days: 7
