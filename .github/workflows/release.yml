name: Release

# Produces downloadable installers and a draft GitHub release. Nothing is ever
# published automatically: a human reviews the draft, verifies SHA256SUMS.txt,
# then clicks Publish. The app lives in `televault/`, so all builds use it as
# their working directory. This file must be at the REPO ROOT to be discovered.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + checksum + upload a bundle artifact; never touch a release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: televault
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: televault/package-lock.json
      - name: Install Linux app runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-0 libnotify4 libnss3
      - run: npm ci
      # ubuntu-latest has RPM 4.x, which electron-builder's bundled fpm 1.9.3
      # supports. (RPM 6 on the local dev host cannot build the RPM.)
      - name: Build AppImage + deb + rpm
        run: npm run build:prepare && npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: televault/release/
          retention-days: 14

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022 # has the VS C++ build tools node-gyp needs
    timeout-minutes: 45
    defaults:
      run:
        working-directory: televault
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: televault/package-lock.json
      # node-gyp (via electron-rebuild's postinstall) imports distutils, removed
      # in Python 3.12+. Pin 3.11 so npm ci can rebuild native modules.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build NSIS installer
        run: npm run build:prepare && npx electron-builder --win --x64 --publish never
        env:
          # Optional: unsigned when secrets are absent.
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: televault/release/
          retention-days: 14

  build-mac-x64:
    name: Build macOS x64 (Intel)
    runs-on: macos-15-intel # macos-13 and macos-14 are retired
    timeout-minutes: 45
    defaults:
      run:
        working-directory: televault
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: televault/package-lock.json
      # node-gyp (via electron-rebuild's postinstall) imports distutils, removed
      # in Python 3.12+. Pin 3.11 so npm ci can rebuild native modules.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      # Only export CSC_* when a certificate is configured. An empty CSC_LINK
      # makes electron-builder treat the project directory as a certificate file.
      - name: Export macOS signing secrets when configured
        if: ${{ env.MAC_CERT_P12 != '' }}
        run: |
          echo "CSC_LINK=${MAC_CERT_P12}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${MAC_CERT_PASSWORD}" >> "$GITHUB_ENV"
      - name: Build x64 app
        run: npm run build:prepare && npx electron-builder --mac --x64 --dir --publish never
      # Without a Developer ID, electron-builder leaves the bundle unsigned.
      # Ad-hoc sign it so the app has a valid seal (the standard Gatekeeper
      # warning remains, but there is no "damaged and can't be opened" error).
      # Skip this when a real signing certificate is configured.
      - name: Ad-hoc sign x64 app (no Developer ID configured)
        if: ${{ env.MAC_CERT_P12 == '' }}
        run: |
          set -euo pipefail
          codesign --force --deep --sign - --options runtime --timestamp=none \
            --entitlements build/entitlements.mac.adhoc.plist \
            release/mac-x64/TeleVault.app
          codesign --verify --deep --strict --verbose=2 release/mac-x64/TeleVault.app
      - name: Build x64 DMG + ZIP from signed app
        run: npx electron-builder --mac --x64 --publish never --prepackaged release/mac-x64/TeleVault.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-mac-x64
          path: televault/release/
          retention-days: 14

  build-mac-arm64:
    name: Build macOS arm64 (Apple Silicon)
    # macos-15 is arm64 and has more reliable capacity than macos-latest
    # (macos-26); four dry-run attempts on the latter were cancelled in queue.
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: televault
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: televault/package-lock.json
      # node-gyp (via electron-rebuild's postinstall) imports distutils, removed
      # in Python 3.12+. Pin 3.11 so npm ci can rebuild native modules.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Export macOS signing secrets when configured
        if: ${{ env.MAC_CERT_P12 != '' }}
        run: |
          echo "CSC_LINK=${MAC_CERT_P12}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${MAC_CERT_PASSWORD}" >> "$GITHUB_ENV"
      - name: Build arm64 app
        run: npm run build:prepare && npx electron-builder --mac --arm64 --dir --publish never
      # Without a Developer ID, electron-builder leaves the bundle unsigned;
      # a quarantined unsigned app shows "TeleVault is damaged and can't be
      # opened" on Apple Silicon, with no Open Anyway bypass. A full ad-hoc
      # signature gives a valid seal and the standard notarization warning
      # instead. Skip this when a real signing certificate is configured.
      - name: Ad-hoc sign arm64 app (no Developer ID configured)
        if: ${{ env.MAC_CERT_P12 == '' }}
        run: |
          set -euo pipefail
          codesign --force --deep --sign - --options runtime --timestamp=none \
            --entitlements build/entitlements.mac.adhoc.plist \
            release/mac-arm64/TeleVault.app
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/TeleVault.app
      - name: Build arm64 DMG + ZIP from signed app
        run: npx electron-builder --mac --arm64 --publish never --prepackaged release/mac-arm64/TeleVault.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-mac-arm64
          path: televault/release/
          retention-days: 14

  assemble:
    name: Assemble + checksum + draft release
    needs: [build-linux, build-windows, build-mac-x64, build-mac-arm64]
    if: >-
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Stage installers and update metadata
        run: |
          set -euo pipefail
          mkdir -p stage
          find artifacts -type f \( -name 'TeleVault-*' -o -name 'latest*.yml' \) -exec cp -f {} stage/ \;
          echo "=== staged files ==="
          ls -lh stage/
      - name: Generate SHA256SUMS.txt
        run: node televault/scripts/generate-checksums.mjs stage
      - name: Verify checksums
        run: cd stage && sha256sum -c SHA256SUMS.txt
      - name: Upload combined bundle (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: televault-release-bundle
          path: stage/
          retention-days: 14
      - name: Create DRAFT release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "TeleVault ${GITHUB_REF_NAME}" \
            --generate-notes \
            stage/*
          echo "Draft release created for ${GITHUB_REF_NAME} — verify then publish manually."
